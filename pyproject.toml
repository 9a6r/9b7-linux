[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nineb7-bis"
version = "0.1.0"
description = "9b7 BIS Studio and auditable business-data automation"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
desktop = ["PySide6>=6.8,<7"]
databases = ["psycopg[binary]>=3.2,<4", "PyMySQL>=1.1,<2", "pymongo>=4.10,<5", "redis>=5,<7", "cassandra-driver>=3.29,<4"]
dev = ["PyYAML==6.0.3", "shellcheck-py==0.11.0.1"]

[project.scripts]
9b7-flow = "nineb7.flow:main"
9b7-studio = "nineb7.studio:main"
9b7-services = "nineb7.services:main"
9b7-agents = "nineb7.agents:main"

[tool.setuptools]
packages = ["nineb7"]

